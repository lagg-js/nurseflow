{% extends "base.html" %}
{% block title %}Novo Paciente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4">
            <h3 class="mb-4"><i class="fas fa-user-plus text-primary me-2"></i>Cadastrar Novo Paciente</h3>
            <form method="POST">
                <fieldset class="border p-3 mb-3">
                    <legend class="h6"><i class="fas fa-id-card me-2"></i>Identificação</legend>
                    <div class="row">
                        <div class="col-md-8 mb-3"><label class="form-label">Nome Completo *</label><input type="text" name="name" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Data de Nascimento *</label><input type="date" name="birth_date" class="form-control" required></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">CPF</label><input type="text" name="cpf" class="form-control" placeholder="000.000.000-00"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Telefone</label><input type="text" name="phone" class="form-control" placeholder="(00) 00000-0000"></div>
                    </div>
                </fieldset>
                <fieldset class="border p-3 mb-3">
                    <legend class="h6"><i class="fas fa-phone-alt me-2"></i>Contato de Emergência</legend>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Nome do Contato *</label><input type="text" name="emergency_contact" class="form-control" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Telefone do Contato *</label><input type="text" name="emergency_phone" class="form-control" required></div>
                    </div>
                </fieldset>
                <fieldset class="border p-3 mb-3">
                    <legend class="h6"><i class="fas fa-notes-medical me-2"></i>Informações Clínicas</legend>
                    <div class="mb-3">
                        <label class="form-label fw-bold"><i class="fas fa-exclamation-triangle text-warning me-1"></i>Alergias</label>
                        <div class="mt-2">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="allergy_status" value="nao_informado" id="allergy_not_informed" checked>
                                <label class="form-check-label" for="allergy_not_informed"><span class="badge bg-secondary">Não informado</span> <small class="text-muted d-block">A informação ainda não foi verificada</small></label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="allergy_status" value="sem_alergias_conhecidas" id="allergy_none">
                                <label class="form-check-label" for="allergy_none"><span class="badge bg-success">Sem alergias conhecidas</span> <small class="text-muted d-block">Paciente negou alergias</small></label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="allergy_status" value="com_alergias" id="allergy_has">
                                <label class="form-check-label" for="allergy_has"><span class="badge bg-warning text-dark">Com alergias</span> <small class="text-muted d-block">Descreva abaixo quais são</small></label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3" id="allergy_description_field" style="display:none;">
                        <label class="form-label">Descreva as alergias</label>
                        <input type="text" name="allergies_description" class="form-control" placeholder="Ex: Penicilina, dipirona, morango...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Informações clínicas relevantes</label>
                        <textarea name="clinical_info" class="form-control" rows="2" placeholder="Doenças crônicas, cirurgias, condições relevantes..."></textarea>
                        <small class="text-muted">Registre apenas informações que impactam o cuidado diário</small>
                    </div>
                </fieldset>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Salvar Paciente</button>
                    <a href="{{ url_for('patient_list') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
document.querySelectorAll('input[name="allergy_status"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
        var field = document.getElementById('allergy_description_field');
        if (this.value === 'com_alergias') { field.style.display = 'block'; }
        else { field.style.display = 'none'; document.querySelector('input[name="allergies_description"]').value = ''; }
    });
});
if (document.querySelector('input[name="allergy_status"]:checked')?.value === 'com_alergias') {
    document.getElementById('allergy_description_field').style.display = 'block';
} else {
    document.getElementById('allergy_description_field').style.display = 'none';
}
</script>
{% endblock %}
