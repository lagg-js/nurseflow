{% extends "base.html" %}
{% block title %}Editar Paciente{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-sm p-4">
            <h3 class="mb-4"><i class="fas fa-user-edit text-primary me-2"></i>Editar Paciente</h3>
            <form method="POST">
                <fieldset class="border p-3 mb-3">
                    <legend class="h6"><i class="fas fa-id-card me-2"></i>Identificação</legend>
                    <div class="row">
                        <div class="col-md-8 mb-3"><label class="form-label">Nome Completo *</label><input type="text" name="name" class="form-control" value="{{ patient.name }}" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label">Data de Nascimento *</label><input type="date" name="birth_date" class="form-control" value="{{ patient.birth_date.strftime('%Y-%m-%d') }}" required></div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">CPF</label><input type="text" name="cpf" class="form-control" value="{{ patient.cpf or '' }}" placeholder="000.000.000-00"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Telefone</label><input type="text" name="phone" class="form-control" value="{{ patient.phone or '' }}" placeholder="(00) 00000-0000"></div>
                    </div>
                </fieldset>
                <fieldset class="border p-3 mb-3">
                    <legend class="h6"><i class="fas fa-phone-alt me-2"></i>Contato de Emergência</legend>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">Nome do Contato *</label><input type="text" name="emergency_contact" class="form-control" value="{{ patient.emergency_contact or '' }}" required></div>
                        <div class="col-md-6 mb-3"><label class="form-label">Telefone do Contato *</label><input type="text" name="emergency_phone" class="form-control" value="{{ patient.emergency_phone or '' }}" required></div>
                    </div>
                </fieldset>
                <fieldset class="border p-3 mb-3">
                    <legend class="h6"><i class="fas fa-notes-medical me-2"></i>Informações Clínicas</legend>
                    <div class="mb-3">
                        <label class="form-label fw-bold"><i class="fas fa-exclamation-triangle text-warning me-1"></i>Alergias</label>
                        {% set status = patient.allergy_status.value if patient.allergy_status else 'nao_informado' %}
                        <div class="mt-2">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="allergy_status" value="nao_informado" id="edit_allergy_not_informed" {% if status == 'nao_informado' %}checked{% endif %}>
                                <label for="edit_allergy_not_informed"><span class="badge bg-secondary">Não informado</span></label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="allergy_status" value="sem_alergias_conhecidas" id="edit_allergy_none" {% if status == 'sem_alergias_conhecidas' %}checked{% endif %}>
                                <label for="edit_allergy_none"><span class="badge bg-success">Sem alergias conhecidas</span></label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="allergy_status" value="com_alergias" id="edit_allergy_has" {% if status == 'com_alergias' %}checked{% endif %}>
                                <label for="edit_allergy_has"><span class="badge bg-warning text-dark">Com alergias</span></label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3" id="edit_allergy_description_field" {% if status != 'com_alergias' %}style="display:none;"{% endif %}>
                        <label class="form-label">Descreva as alergias</label>
                        <input type="text" name="allergies_description" class="form-control" value="{{ patient.allergies_description or '' }}" placeholder="Ex: Penicilina, dipirona...">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Informações clínicas relevantes</label>
                        <textarea name="clinical_info" class="form-control" rows="2">{{ patient.clinical_info or '' }}</textarea>
                    </div>
                </fieldset>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Atualizar Paciente</button>
                    <a href="{{ url_for('patient_detail', id=patient.id) }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
document.querySelectorAll('input[name="allergy_status"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
        var field = document.getElementById('edit_allergy_description_field');
        if (this.value === 'com_alergias') { field.style.display = 'block'; }
        else { field.style.display = 'none'; document.querySelector('input[name="allergies_description"]').value = ''; }
    });
});
</script>
{% endblock %}
